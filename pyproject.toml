[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xian-mcp-server"
version = "0.1.0"
description = "MCP and HTTP server for interacting with the Xian blockchain"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "aiohttp>=3.13.5,<4",
  "eth-account>=0.13.7,<0.14",
  "eth-utils>=6.0.0,<7",
  "fastapi>=0.136.1,<0.137",
  "httpx>=0.28.1,<0.29",
  "mcp[cli]>=1.27.0,<2",
  "uvicorn>=0.46.0,<0.47",
  "xian-tech-py[eth,hd]>=0.4.15,<0.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.3.0,<2",
  "ruff>=0.15.12,<0.16",
]

[project.scripts]
xian-mcp-server = "xian_server:run_cli"
xian-mcp-http = "http_server:run_http_server"

[tool.setuptools]
py-modules = ["http_server", "serialization", "tool_policy", "xian_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = ["test_*.py"]
testpaths = ["tests/unit"]
markers = [
  "integration: tests that depend on live network services or local test network data",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["F", "I"]
