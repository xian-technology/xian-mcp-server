[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xian-mcp-server"
version = "0.1.1"
description = "MCP and HTTP server for interacting with the Xian blockchain"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "aiohttp>=3.13.5,<4",
  "eth-account>=0.13.7,<0.14",
  "eth-utils>=6.0.0,<7",
  "fastapi>=0.136.1,<0.137",
  "httpx>=0.28.1,<0.29",
  "mcp[cli]>=1.27.0,<2",
  "uvicorn>=0.46.0,<0.47",
  "xian-tech-runtime-types>=0.1.6,<0.2",
  "xian-tech-py[eth,hd]>=0.5.3,<0.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.3.0,<2",
  "ruff>=0.15.12,<0.16",
]

[project.scripts]
xian-mcp-server = "xian_server:run_cli"
xian-mcp-http = "http_server:run_http_server"

[tool.setuptools]
py-modules = [
  "dex_plan_registry",
  "dex_tools",
  "http_server",
  "logging_setup",
  "serialization",
  "tool_policy",
  "xian_server",
  "xian_connection",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = ["test_*.py"]
testpaths = ["tests/unit"]
markers = [
  "integration: tests that depend on live network services or local test network data",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["F", "I"]

# Standalone builds use release-candidate source revisions until the V2 SDK
# packages are published. Ignore sibling-only editable sources in their metadata.
[tool.uv]
no-sources = true
override-dependencies = [
  "xian-tech-py[eth,hd] @ git+https://github.com/xian-technology/xian-py@2a3cd927f3f18e4e7f3d0aefdbf11457d83acd8e",
  "xian-tech-runtime-types @ git+https://github.com/xian-technology/xian-contracting@12b1c31f98d535a278b0c00e40dd90584f6b52f4#subdirectory=packages/xian-runtime-types",
]
