services:
  # Standard MCP server (stdio transport for Claude Desktop, LM Studio, etc.)
  xian-mcp:
    build:
      context: .
      target: local
      additional_contexts:
        xian_py: ../xian-py
        xian_accounts: ../xian-contracting/packages/xian-accounts
        xian_runtime_types: ../xian-contracting/packages/xian-runtime-types
    image: xian-mcp-server:latest
    environment:
      - XIAN_CHAIN_ID=${XIAN_CHAIN_ID:-xian-local-1}
      - XIAN_NODE_URL=${XIAN_NODE_URL:-http://127.0.0.1:26657}
      - XIAN_GRAPHQL=${XIAN_GRAPHQL:-http://127.0.0.1:5000/graphql}
      - XIAN_MCP_ENABLE_UNSAFE_WALLET_TOOLS=${XIAN_MCP_ENABLE_UNSAFE_WALLET_TOOLS:-false}
      - XIAN_MCP_DEX_PLAN_TTL_SECONDS=${XIAN_MCP_DEX_PLAN_TTL_SECONDS:-300}
      - XIAN_MCP_DEX_PLAN_MAX_ENTRIES=${XIAN_MCP_DEX_PLAN_MAX_ENTRIES:-256}
    stdin_open: true
    tty: true

  # HTTP API mode (REST bridge for web apps, AI tool-calling, etc.)
  xian-mcp-http:
    build:
      context: .
      target: local
      additional_contexts:
        xian_py: ../xian-py
        xian_accounts: ../xian-contracting/packages/xian-accounts
        xian_runtime_types: ../xian-contracting/packages/xian-runtime-types
    image: xian-mcp-server:latest
    command: ["xian-mcp-http"]
    ports:
      - target: 8100
        published: "${HTTP_PORT:-8100}"
        host_ip: "${HTTP_PUBLISH_HOST:-127.0.0.1}"
        protocol: tcp
    environment:
      - XIAN_CHAIN_ID=${XIAN_CHAIN_ID:-xian-local-1}
      - XIAN_NODE_URL=${XIAN_NODE_URL:-http://127.0.0.1:26657}
      - XIAN_GRAPHQL=${XIAN_GRAPHQL:-http://127.0.0.1:5000/graphql}
      - XIAN_MCP_ENABLE_UNSAFE_WALLET_TOOLS=${XIAN_MCP_ENABLE_UNSAFE_WALLET_TOOLS:-false}
      - XIAN_MCP_DEX_PLAN_TTL_SECONDS=${XIAN_MCP_DEX_PLAN_TTL_SECONDS:-300}
      - XIAN_MCP_DEX_PLAN_MAX_ENTRIES=${XIAN_MCP_DEX_PLAN_MAX_ENTRIES:-256}
      - XIAN_MCP_HTTP_TOKEN=${XIAN_MCP_HTTP_TOKEN:-}
      - XIAN_MCP_HTTP_CORS_ORIGINS=${XIAN_MCP_HTTP_CORS_ORIGINS:-}
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8100
    restart: unless-stopped
