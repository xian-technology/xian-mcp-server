name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      run_integration:
        description: Run live integration tests
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: xian-mcp-server
    steps:
      - name: Checkout xian-mcp-server
        uses: actions/checkout@v6
        with:
          path: xian-mcp-server

      - name: Checkout xian-py
        uses: actions/checkout@v6
        with:
          repository: xian-technology/xian-py
          path: xian-py

      - name: Checkout xian-contracting
        uses: actions/checkout@v6
        with:
          repository: xian-technology/xian-contracting
          path: xian-contracting

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Run unit tests
        run: uv run --extra dev pytest -q

      - name: MCP handshake smoke test
        run: uv run xian-mcp-server < test_requests.jsonl

  integration:
    name: Integration
    needs: unit
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_integration == true)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: xian-mcp-server
    steps:
      - name: Checkout xian-mcp-server
        uses: actions/checkout@v6
        with:
          path: xian-mcp-server

      - name: Checkout xian-py
        uses: actions/checkout@v6
        with:
          repository: xian-technology/xian-py
          path: xian-py

      - name: Checkout xian-contracting
        uses: actions/checkout@v6
        with:
          repository: xian-technology/xian-contracting
          path: xian-contracting

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Run integration tests
        run: uv run --extra dev pytest -q tests/integration
